Master.In="Input track"
Master.HowTo.Text="<b>Tick Enable master: from the next stream on, the stream goes through it.</b><br>The master takes the mix of the <b>input track</b> and applies its volume and VST filters. The result goes to a virtual track used only by the stream.<ul><li>OBS's Tracks 1 to 6, its output settings and your recordings are not changed.</li><li>Nothing is saved in OBS's settings: after a crash, or without VST Ex, OBS simply streams its normal sound.</li><li>If the stream can't go through the master, it starts with the normal sound and a warning shows here.</li><li>Enabling applies at the next stream start. During a stream the settings are locked.</li></ul><b>Timing:</b> the master stays in sync with the video; only the latency of its plugins is added.<br><b>Filters:</b> this menu or the VST Ex Mixer."
Master.Status.Off.Tip="The master is off. Open the menu (⋮) to enable it."
Master.Status.Ready="Tr%1: ready"
Master.Status.Ready.Tip="The next stream goes through the master. Only the stream hears it, not recordings."
Master.Status.Ok="Tr%1 > ON AIR"
Master.Status.Ok.Tip="The stream goes through the master."
Master.Status.Failed="Normal sound on stream"
Master.Status.Failed.Tip="This stream couldn't go through the master, so it uses OBS's normal sound. This happens with Enhanced Broadcasting, or when a running recording shares the stream's audio encoder."
Master.Unlock.Cautions="<b>Experimental: please read before using.</b><ul><li>Details of its behaviour are not verified yet. The sound of a stream may stop, break up or drift from the video.</li><li>Always check it with a private test stream before using it on a real one.</li><li>It works on streams only, not on recordings.</li><li>An OBS update may stop it from working.</li><li>Heavy plugins on the master can disturb all of OBS's audio.</li></ul>"
Master.Unlock.Agree="I have read how to use it and the cautions above, and I accept them"
