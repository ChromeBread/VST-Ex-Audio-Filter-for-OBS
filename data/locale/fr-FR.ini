Master.Status.Ready.Tip="Le prochain stream passera par le master. Seul le stream l'entend, pas les enregistrements."
Master.Status.Ok="Tr%1 > ON AIR"
Master.Status.Ok.Tip="Le stream passe par le master."
Master.Status.Failed="Son normal sur le stream"
Master.Status.Failed.Tip="Ce stream n'a pas pu passer par le master et utilise le son normal d'OBS. Cela arrive avec Enhanced Broadcasting, ou quand un enregistrement en cours partage l'encodeur audio du stream."
Master.Unlock.Cautions="<b>Fonction expérimentale : à lire avant utilisation.</b><ul><li>Le détail de son fonctionnement n'est pas encore vérifié. Le son du stream peut s'arrêter, se couper ou se décaler de la vidéo.</li><li>Vérifiez toujours avec un stream de test privé avant un vrai stream.</li><li>Il agit uniquement sur les streams, pas sur les enregistrements.</li><li>Une mise à jour d'OBS peut l'empêcher de fonctionner.</li><li>Des plugins lourds sur le master peuvent perturber tout l'audio d'OBS.</li></ul>"
Master.Unlock.Agree="J'ai lu le mode d'emploi et les avertissements ci-dessus et je les accepte"
