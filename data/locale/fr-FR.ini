Master.In="Piste d'entrée"
Master.HowTo.Text="<b>Cochez Activer le master : le stream suivant passera par lui.</b><br>Le master prend le mixage de la <b>piste d'entrée</b> et applique son volume et ses filtres VST. Le résultat va vers une piste virtuelle utilisée uniquement par le stream.<ul><li>Les pistes 1 à 6 d'OBS, ses réglages de sortie et vos enregistrements ne changent pas.</li><li>Rien n'est enregistré dans les réglages d'OBS : après un plantage, ou sans VST Ex, OBS diffuse simplement son son normal.</li><li>Si le stream ne peut pas passer par le master, il démarre avec le son normal et un avertissement s'affiche ici.</li><li>L'activation s'applique au prochain démarrage du stream. Pendant le stream, les réglages sont verrouillés.</li></ul><b>Synchro :</b> le master reste synchronisé avec la vidéo ; seule la latence de ses plugins s'ajoute.<br><b>Filtres :</b> ce menu ou le VST Ex Mixer."
Master.Status.Off.Tip="Le master est désactivé. Ouvrez le menu (⋮) pour l'activer."
